syntax = "proto3";
package product.v1;
option java_package = "com.grepp.backend5.product.grpc";
option java_multiple_files = true;

// 내부 서비스에서 사용하는 상품 조회 API.
service ProductService {
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
}
message GetProductRequest { string product_id = 1; }
message ListProductsRequest {}
message ProductResponse {
  string id = 1;
  string seller_id = 2;
  string name = 3;
  optional string description = 4;
  // 소수점 정밀도를 유지하기 위해 문자열로 전달한다.
  string price = 5;
  int32 stock = 6;
  string status = 7;
}
message ListProductsResponse { repeated ProductResponse products = 1; }
