spring:
  config:
    import: optional:file:.env[.properties]
  data:
    elasticsearch:
      repositories:
        enabled: ${search.elasticsearch.enabled:false}
  batch:
    job:
      enabled: false
  application:
    name: backend5-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend5}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql
      continue-on-error: true

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}} # random port 사용시 eureka server에 인스턴스가 각각 표시되지 않는다
    preferIpAddress: true # 서비스간 통신 시 hostname 보다 ip 를 우선
  client:
    register-with-eureka: false # eureka 서버에 등록
    fetch-registry: true # 외부 검색 가능
    service-url:
      defaultZone: http://admin:admin@${eureka.instance.hostname:localhost}:8761/eureka

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0

payment:
  toss:
    secret-key: ${TOSS_PAYMENT_SECRET}

jwt:
  private-key: ${PRIVATE_KEY}
  public-key: ${PUBLIC_KEY}

openai:
  embedding:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: text-embedding-3-small
  chat:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.4-nano
  image-analysis:
    model: gpt-5.4-nano
  image:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-image-1-mini

search:
  elasticsearch:
    enabled: false

kafka:
  enabled: false
  bootstrap-servers: localhost:9092
  topic:
    async-orders: async-orders
  consumer:
    group-id: async-sample-group

logging:
  level:
    org.apache.kafka.clients.admin.internals.AdminMetadataManager: WARN
    org.apache.kafka.clients.NetworkClient: WARN

app:
  openapi:
    server-url: http://localhost:8080
