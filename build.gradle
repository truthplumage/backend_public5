plugins {
	id 'java'
    id 'com.google.protobuf' version '0.9.5'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.grepp'
version = '0.0.1-SNAPSHOT'
description = '백엔드 심화 5기 학습용 프로젝트'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation platform('org.springframework.grpc:spring-grpc-dependencies:1.0.0')
    implementation 'org.springframework.grpc:spring-grpc-server-spring-boot-starter'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'

    //web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    //lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'io.grpc:grpc-netty'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.33.1' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.77.0' }
    }
    generateProtoTasks {
        all().configureEach { task -> task.plugins { grpc {} } }
    }
}
